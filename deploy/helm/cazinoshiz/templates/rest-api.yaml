{{- if .Values.bff.rest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  labels:
    app.kubernetes.io/component: rest-api
    {{- include "cazinoshiz.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bff.rest.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/component: rest-api, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/component: rest-api, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      containers:
        - name: rest-api
          image: {{ .Values.images.restApi }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- with .Values.resources.rest }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ default "Production" .Values.rest.environment | quote }}
            - name: Backend__GrpcAddress
              value: http://game-admin:8081
            {{- range $name, $game := .Values.games }}
            - name: Backend__GameAddresses__{{ $game.routeKey }}
              value: http://game-{{ $name }}:8081
            {{- end }}
            - name: Rest__Jwt__Authority
              value: {{ .Values.rest.jwt.authority | quote }}
            - name: Rest__Jwt__Audience
              value: {{ .Values.rest.jwt.audience | quote }}
            - name: Rest__Jwt__RequireHttpsMetadata
              value: {{ .Values.rest.jwt.requireHttpsMetadata | quote }}
            - name: Rest__DevelopmentAuthentication__Enabled
              value: {{ .Values.rest.developmentAuthentication.enabled | quote }}
            - name: Rest__DevelopmentAuthentication__TenantId
              value: {{ .Values.rest.developmentAuthentication.tenantId | quote }}
            - name: Rest__DevelopmentAuthentication__ScopeId
              value: {{ .Values.rest.developmentAuthentication.scopeId | quote }}
            - name: Rest__DevelopmentAuthentication__UserId
              value: {{ .Values.rest.developmentAuthentication.userId | quote }}
            - name: Rest__DevelopmentAuthentication__DisplayName
              value: {{ .Values.rest.developmentAuthentication.displayName | quote }}
            - name: RateLimit__Enabled
              value: {{ .Values.rest.rateLimit.enabled | quote }}
            {{- if .Values.rest.developmentAuthentication.enabled }}
            - name: Rest__DevelopmentAuthentication__Token
              valueFrom:
                secretKeyRef:
                  name: {{ include "cazinoshiz.secret" . }}
                  key: {{ .Values.rest.developmentAuthentication.tokenSecretKey }}
            {{- end }}
            {{- if .Values.observability.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            {{- end }}
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: rest-api }
spec:
  selector: { app.kubernetes.io/component: rest-api, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports: [{ name: http, port: 8080, targetPort: http }]
{{- end }}
